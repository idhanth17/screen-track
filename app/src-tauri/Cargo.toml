[package]
name = "screen-track-app"
version = "0.1.0"
edition = "2021"
description = "Screen Track desktop tray app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
screentrack-core = { path = "../../core" }

[[bin]]
name = "screen-track-app"
path = "src/main.rs"
