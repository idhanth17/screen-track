[package]
name = "screentrack-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Screen Track engine: OS capture, classification, storage."

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
anyhow = "1"
ctrlc = "3"
tiny_http = "0.12"

# Bundled, on-device sentence-embedding classifier (MiniLM) — pure-Rust inference
# via candle, so there is no native runtime/DLL to ship and nothing to download.
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[[bin]]
name = "screentrackd"
path = "src/bin/screentrackd.rs"
